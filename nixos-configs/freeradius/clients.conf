# RADIUS clients (authenticators) for the proton network.  Managed by nix-config
# (nixos-configs/freeradius.nix); overlaid onto the upstream example raddb.
#
# The access points land here once they are installed and addressed.  That list
# is generated per-AP from facts.nix by nixos-configs/freeradius-facts.nix —
# keep the real APs (and their shared secrets) there, not in this file.
#
# Until the AP hardware exists, only loopback is defined, for `radclient` /
# `radtest` smoke tests run on silicon itself.  The shared secret below is the
# FreeRADIUS default test secret; loopback is not reachable off-box, so it
# grants nothing.  Do NOT add a real off-box client here without a generated
# secret delivered via credentials.
client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}
